name: setup-check

# The "did I do it right?" button. Run manually from the Actions tab after
# adding your secrets — it tests every piece and messages your Telegram bot
# on success.
on:
  workflow_dispatch:

permissions:
  contents: write   # lets the success step commit the scheduler-nudge marker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run setup check
        env:
          PP_STORE_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m portfolio_pulse.jobs.setup_check
      - name: Wake the scheduler (fresh forks' crons start after a commit)
        # Runs only if the checks above passed. One marker commit reliably
        # registers this fork's scheduled workflows with GitHub's cron.
        run: |
          if [ ! -f .setup-complete ]; then
            date -u +"setup verified %Y-%m-%dT%H:%M:%SZ" > .setup-complete
            git config user.name "portfolio-pulse-setup"
            git config user.email "actions@users.noreply.github.com"
            git add .setup-complete
            git commit -m "Setup verified — activate scheduled workflows"
            git push
            echo "Scheduler nudge committed. Automatic runs begin shortly."
          else
            echo "Setup marker already present — nothing to do."
          fi
