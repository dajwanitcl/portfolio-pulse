name: pulse-loop

# Self-perpetuating ~10-minute poller — guaranteed cadence with no external
# services or tokens. One run polls every ~10 min for up to ~5.5 h, then
# dispatches a fresh copy of itself (workflow_dispatch via GITHUB_TOKEN is
# exempt from GitHub's no-recursive-trigger rule). Outside 08:00–24:00 IST it
# exits quietly; the hourly cron below restarts the chain each morning and
# after any breakage. setup-check also starts it directly on a fresh install.
#
# Opt out any time: set repository variable PP_TURBO=off (Settings →
# Secrets and variables → Actions → Variables) — the jittery fast-poll cron
# then remains as the only driver.
on:
  workflow_dispatch:
  schedule:
    #- cron: "7 2-18 * * *"   # hourly restart net during the IST window
    - cron: "*/1 * * * *"
    
permissions:
  actions: write

concurrency:
  group: pulse-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll every ~10 min, then hand over to a fresh run
        env:
          PP_STORE_BACKEND: supabase
          PP_DASHBOARD_URL: ${{ vars.PP_DASHBOARD_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ vars.PP_TURBO }}" = "off" ]; then
            echo "PP_TURBO=off — loop disabled; cron-based polling remains."
            exit 0
          fi
          START=$(date +%s)
          HANDOVER=0
          while true; do
            H=$(( 10#$(TZ=Asia/Kolkata date +%H) ))
            if [ "$H" -lt 8 ]; then
              echo "Outside 08:00-24:00 IST (hour $H) — sleeping until morning restart."
              break   # no handover: the hourly cron revives the chain at ~07:37 IST
            fi
            python -m portfolio_pulse.jobs.heartbeat || true
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -gt 19800 ]; then   # ~5.5 h: hand over before the 6 h limit
              HANDOVER=1
              break
            fi
            sleep 540
          done
          if [ "$HANDOVER" = "1" ]; then
            echo "Handing over to a fresh run..."
            gh workflow run pulse_loop.yml --repo "$GITHUB_REPOSITORY" || true
          fi
